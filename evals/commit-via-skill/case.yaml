schema_version: "1.0"
name: commit-via-skill
description: In an onboarded repo, "commit this" is not done by hand; the user is pointed to /sdw:commit (core.md house rules).
tags: [core]
plugins: [../../plugin]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    I finished the change in greet.js and checked it by hand. Commit this.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Bash, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: no-git-commit
    tool: Bash
    input_match: '\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
    arm: both
    weight: 2
  - type: regex
    name: names-sdw-commit
    target: last_message
    pattern: '/sdw:commit'
